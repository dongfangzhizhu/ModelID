<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>modeld</title>
  <meta name="description" content="modeld local Web UI: manage AI models, deduplicate files, track reference graphs">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar navigation (labels injected by main.js after i18n init) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">⬡</div>
        <div class="brand-text">
          <span class="brand-name">modeld</span>
          <span class="brand-sub"></span>
        </div>
      </div>

      <!-- Nav items built programmatically by main.js (supports i18n) -->
      <nav class="sidebar-nav" id="sidebar-nav"></nav>

      <!-- Footer: WS indicator + language toggle (built by main.js) -->
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>

    <!-- Main content area -->
    <main class="main-content">
      <div id="page-content" class="page-content"></div>
    </main>
  </div>

  <!-- Global confirm dialog -->
  <dialog id="confirm-dialog" class="modal-dialog">
    <div class="modal-header">
      <h3 id="dialog-title">Confirm</h3>
    </div>
    <div class="modal-body" id="dialog-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="dialog-cancel">Cancel</button>
      <button class="btn btn-danger" id="dialog-confirm">Confirm</button>
    </div>
  </dialog>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
