[workspace]
resolver = "2"
members = [
    "crates/modeld-core",
    "crates/modeld-cli",
    "crates/modeld-proxy",
    "crates/modeld-client",
    "crates/modeld-webui",
]

[workspace.package]
version = "0.1.0"
authors = ["modeld contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/dongfangzhizhu/modeld"

[workspace.dependencies]
# Core dependencies
blake3 = { version = "1.5", features = ["rayon", "mmap"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rayon = "1.8"
walkdir = "2.4"
memmap2 = "0.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4"] }
ureq = "2.9"
sha2 = "0.10"
sys-locale = "0.3"
libc = "0.2"

# CLI
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
colored = "2.1"

# Phase 5: proxy server
tiny_http = "0.12"
toml = "0.8"
ctrlc = "3.4"
mdns = "3.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web UI server
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "fs"] }
rust-embed = { version = "8", features = ["compression", "include-exclude"] }
mime_guess = "2.0"

# Testing
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
